<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robot Face - Phone Sensors Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;background:#071426;overflow:hidden;font-family:Tahoma,Arial,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:800px;height:480px;background:#071426;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0}
.page{position:absolute;left:0;top:0;width:800px;height:390px;background:#0a1626;opacity:0;pointer-events:none;-webkit-transition:opacity .3s;transition:opacity .3s}
.page.active{opacity:1}
#pFace{background:#071426}
#faceCv{position:absolute;left:0;top:0}
.title{position:absolute;top:8px;right:20px;font-size:36px;font-weight:bold;color:#a8e6ff;direction:rtl}
.lbl{font-size:30px;font-weight:bold;direction:rtl;text-align:center}
.stat{font-size:28px;font-weight:bold;margin-top:10px;direction:rtl;text-align:center}
#bar{position:absolute;left:0;top:390px;width:800px;height:90px;background:#000;border-top:2px solid #222}
#btn{position:absolute;left:230px;top:5px;width:340px;height:80px;border-radius:16px;background:#0e3a5c;border:3px solid #00cfff;color:#fff;font-size:42px;line-height:74px;text-align:center;font-weight:bold}
#btn.down{background:#00cfff;color:#000}
#micBtn{position:absolute;left:20px;top:50px;width:240px;height:60px;border-radius:14px;background:#0e3a5c;border:2px solid #00cfff;color:#fff;font-size:28px;font-weight:bold;text-align:center;line-height:56px}
</style>
</head>
<body>
<div id="stage">
<div class="page active" id="pFace"><canvas id="faceCv" width="800" height="390"></canvas><div id="micBtn">شروع میکروفون</div><div id="faceMsg" style="position:absolute;left:0;top:10px;width:800px;text-align:center;font-size:32px;font-weight:bold;color:#a8e6ff">—</div></div>
<div class="page" id="pSensors"><div class="title">سنسورهای گوشی (تست)</div><div style="position:absolute;right:20px;top:60px;width:760px">
<div class="stat" id="sMotion">حرکت: —</div>
<div class="stat" id="sAccel">شتاب: —</div>
<div class="stat" id="sTilt">شیب: —</div>
<div class="stat" id="sShake">تکون: —</div>
<div class="stat" id="sMic">میکروفون: خاموش</div>
<div class="stat" id="sSound">صدا: —</div>
<div class="stat" id="sLight">نور مرورگر: —</div>
<div class="stat" style="font-size:24px;color:#9fb0c3">روی ردمی اول تست کن (مرورگر مدرن). روی سامسونگ قدیمی ممکن است میکروفون یا حرکت پشتیبانی نشود.</div>
</div></div>
<div id="bar"><div id="btn">لمس / صفحه بعد</div></div>
</div>
<script>
var USE_SIMULATOR=false;
function $(id){return document.getElementById(id);}
function toFa(s){s=String(s);var out='',i,ch;for(i=0;i<s.length;i++){ch=s.charAt(i);if(ch>='0'&&ch<='9')out+=String.fromCharCode(1776+(ch.charCodeAt(0)-48));else if(ch==='.')out+='\u066B';else out+=ch;}return out;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
var stage=$('stage');
function fit(){var w=window.innerWidth||document.documentElement.clientWidth;var h=window.innerHeight||document.documentElement.clientHeight;var s=Math.min(w/800,h/480);var st=stage.style;st.webkitTransform='scale('+s+')';st.transform='scale('+s+')';st.left=Math.round((w-800*s)/2)+'px';st.top=Math.round((h-480*s)/2)+'px';}
window.addEventListener('resize',fit,false);
window.addEventListener('orientationchange',function(){setTimeout(fit,200);},false);
document.addEventListener('touchmove',function(e){e.preventDefault();},false);
fit();
var cur=0;var PAGE_IDS=['pFace','pSensors'];
function showPage(i){var k,el;for(k=0;k<PAGE_IDS.length;k++){el=$(PAGE_IDS[k]);el.className=el.className.replace(/\s*active/g,'')+(k===i?' active':'');}cur=i;}
var face={lx:0,ly:0,tlx:0,tly:0,mood:'normal',moodUntil:0,nextLook:0,nextBlink:0,blinking:false,blinkStart:0,tearY:0,spin:0};
function setMood(m,ms){face.mood=m;face.moodUntil=new Date().getTime()+ms;var msg='—';if(m==='love')msg='ناز شد!';else if(m==='listening')msg='دارم گوش می دهم…';else if(m==='dizzy')msg='سرم گیج رفت!';else if(m==='happy')msg='خوشحالم';$('faceMsg').innerHTML=msg;}
setInterval(function(){if(face.mood!=='normal'&&new Date().getTime()>face.moodUntil){face.mood='normal';$('faceMsg').innerHTML='—';}},500);
var faceCv=$('faceCv');var fc=faceCv.getContext('2d');
var LOOKS=[[0,0],[-1,0],[1,0],[0,-1],[0,1]];
function drawRoundEye(cx,cy,openAmt,color,iris){
var r=88;fc.save();fc.translate(cx,cy);fc.scale(1,Math.max(0.08,openAmt));
if(face.mood==='dizzy'){fc.strokeStyle=color;fc.lineWidth=8;fc.beginPath();fc.arc(0,0,50,0,Math.PI*2,false);fc.stroke();fc.beginPath();fc.moveTo(-50,-50);fc.lineTo(50,50);fc.moveTo(50,-50);fc.lineTo(-50,50);fc.stroke();}
else{
fc.fillStyle='rgba(0,207,255,0.18)';fc.beginPath();fc.arc(0,0,r+18,0,Math.PI*2,false);fc.fill();
fc.fillStyle=color;fc.beginPath();fc.arc(0,0,r,0,Math.PI*2,false);fc.fill();
fc.fillStyle=iris;fc.beginPath();fc.arc(0,0,52,0,Math.PI*2,false);fc.fill();
if(face.mood==='love'){fc.fillStyle='#ff6b9d';fc.beginPath();fc.arc(-18,-10,16,0,Math.PI*2,false);fc.arc(18,-10,16,0,Math.PI*2,false);fc.fill();fc.beginPath();fc.moveTo(-28,0);fc.lineTo(0,28);fc.lineTo(28,0);fc.closePath();fc.fill();}
else{fc.fillStyle='#000';fc.beginPath();fc.arc(0,0,28,0,Math.PI*2,false);fc.fill();fc.fillStyle='rgba(255,255,255,0.95)';fc.beginPath();fc.arc(-22,-26,13,0,Math.PI*2,false);fc.fill();}
}
fc.restore();
}
function faceStep(){
var now=new Date().getTime();
if(now>=face.nextLook){var L=LOOKS[Math.floor(Math.random()*LOOKS.length)];if(face.mood!=='listening'){face.tlx=L[0];face.tly=L[1];}face.nextLook=now+2000;}
face.lx+=(face.tlx-face.lx)*0.3;face.ly+=(face.tly-face.ly)*0.3;
var blinkOpen=1;
if(face.blinking){var p=(now-face.blinkStart)/200;if(p>=1){face.blinking=false;face.nextBlink=now+3500;}else blinkOpen=1-Math.sin(p*Math.PI);}
else if(now>=face.nextBlink&&face.mood!=='listening'){face.blinking=true;face.blinkStart=now;}
var openAmt=blinkOpen;var col='#00cfff',iris='#0a2a5a';
if(face.mood==='love'){col='#7dd3fc';openAmt*=0.7;}
else if(face.mood==='listening'){openAmt=1;col='#d6f2ff';}
else if(face.mood==='dizzy'){col='#ff9d3c';face.spin+=0.2;}
var ox=face.lx*18,oy=face.ly*14;
if(face.mood==='dizzy'){ox=Math.sin(face.spin)*30;oy=Math.cos(face.spin)*20;}
fc.fillStyle='#071426';fc.fillRect(0,0,800,390);
drawRoundEye(255+ox,190+oy,openAmt,col,iris);
drawRoundEye(545+ox,190+oy,openAmt,col,iris);
if(window._soundLevel&&window._soundLevel>0){
var i,bh;for(i=0;i<7;i++){bh=8+window._soundLevel*40*Math.abs(Math.sin(now/200+i));fc.fillStyle='#00cfff';fc.fillRect(280+i*36,350-bh,20,bh);}
}
}
(function faceLoop(){if(cur===0)faceStep();setTimeout(faceLoop,50);})();
var lastShake=0;
function onMotion(e){
var a=e.accelerationIncludingGravity;
if(!a)return;
var ax=a.x||0,ay=a.y||0,az=a.z||0;
$('sMotion').innerHTML='حرکت: پشتیبانی می شود';
$('sAccel').innerHTML='شتاب: X '+ax.toFixed(1)+' | Y '+ay.toFixed(1)+' | Z '+az.toFixed(1);
if(ax>3)face.tlx=1;else if(ax<-3)face.tlx=-1;else face.tlx=0;
if(ay>3)face.tly=-1;else if(ay<-3)face.tly=1;else face.tly=0;
$('sTilt').innerHTML='شیب: نگاه '+(face.tlx>0?'راست':(face.tlx<0?'چپ':'وسط'));
var mag=Math.sqrt(ax*ax+ay*ay+az*az);
var delta=Math.abs(mag-9.8);
var now=new Date().getTime();
if(delta>12&&now-lastShake>2000){lastShake=now;$('sShake').innerHTML='تکون: بله! گیج شد';setMood('dizzy',4000);}
}
if(window.DeviceMotionEvent){window.addEventListener('devicemotion',onMotion,false);$('sMotion').innerHTML='حرکت: در انتظار داده…';}else{$('sMotion').innerHTML='حرکت: پشتیبانی نمی شود';}
if(window.DeviceOrientationEvent){window.addEventListener('deviceorientation',function(e){},false);}
if('ondevicelight' in window){window.addEventListener('devicelight',function(e){$('sLight').innerHTML='نور مرورگر: '+e.value+' لوکس';},false);}else{$('sLight').innerHTML='نور مرورگر: پشتیبانی نمی شود';}
function pet(){setMood('love',3000);}
faceCv.addEventListener('touchstart',function(e){e.preventDefault();pet();},false);
faceCv.addEventListener('mousedown',function(){pet();},false);
var audioCtx=null,analyser=null,micStream=null;
$('micBtn').addEventListener('click',function(){
var getUserMedia=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
if(!getUserMedia){$('sMic').innerHTML='میکروفون: مرورگر پشتیبانی نمی کند';return;}
try{
getUserMedia.call(navigator,{audio:true},function(stream){
micStream=stream;var AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();
var src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=256;src.connect(analyser);
$('sMic').innerHTML='میکروفون: روشن';$('micBtn').innerHTML='میکروفون روشن است';
},function(err){$('sMic').innerHTML='میکروفون: دسترسی رد شد';});
}catch(err){$('sMic').innerHTML='میکروفون: خطا';}
},false);
setInterval(function(){
if(!analyser)return;
var data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);
var sum=0,i;for(i=0;i<data.length;i++)sum+=data[i];var avg=sum/data.length/255;
window._soundLevel=avg;
$('sSound').innerHTML='صدا: '+Math.round(avg*100)+'%';
if(avg>0.25)setMood('listening',2000);
},300);
var btn=$('btn');
btn.addEventListener('click',function(){showPage((cur+1)%PAGE_IDS.length);},false);
btn.addEventListener('touchstart',function(e){e.preventDefault();showPage((cur+1)%PAGE_IDS.length);},false);
showPage(0);
</script>
</body>
</html>
